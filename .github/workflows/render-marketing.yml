name: Render IceSlice SVG assets
on:
  push:
    paths:
      - 'source/*.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render new SVG files to PNG
        run: |
          mkdir -p posts
          python - <<'PY'
          import glob, os
          import cairosvg
          for src in glob.glob("source/*.svg"):
              dest = os.path.join("posts", os.path.basename(src)[:-4] + ".png")
              cairosvg.svg2png(url=src, write_to=dest, output_width=1080, output_height=1350)
              print(src, "->", dest)
          PY
      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          if ! git diff --cached --quiet; then
            git commit -m "Render IceSlice marketing PNG assets"
            git push
          fi
